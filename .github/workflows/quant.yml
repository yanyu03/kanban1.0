name: Price Radar Quant Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'packages/quant/**'
      - '.github/workflows/quant.yml'
permissions:
  contents: read
concurrency:
  group: price-radar-quant
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/quant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: packages/quant/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Export read-only Supabase references
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            python export_supabase.py
          else
            echo "Supabase secrets missing: fixture mode (NO_INPUT_DATA)"
          fi
      - run: python quant.py data/quotes.json --output output/quant_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-radar-quant-results
          path: packages/quant/output/quant_results.json
          retention-days: 14
